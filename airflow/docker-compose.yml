version: '3'

services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data


  airflow-webserver:

    build: .

    depends_on:
      - postgres

    ports:
      - "8081:8080"


    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow


      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

      - ../job_market:/opt/airflow/job_market
      - C:/Users/user/.dbt:/home/airflow/.dbt
    command: 
      bash -c "
      airflow db init &&
      airflow users create
      --username admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password admin &&
      airflow webserver
      "



  airflow-scheduler:


    build: .


    depends_on:

      - airflow-webserver


    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor


      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow


      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'



    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

      - ../job_market:/opt/airflow/job_market
      - C:/Users/user/.dbt:/home/airflow/.dbt


    command: scheduler



volumes:

  postgres-db-volume: